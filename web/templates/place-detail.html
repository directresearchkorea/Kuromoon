<!DOCTYPE html>
<html lang="{{LANG}}" prefix="og: https://ogp.me/ns#">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id={{GA_MEASUREMENT_ID}}"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', '{{GA_MEASUREMENT_ID}}');

    // Track place detail view
    gtag('event', 'view_place_detail', {
      'place_id': '{{PLACE_ID}}',
      'place_name': '{{PLACE_NAME}}',
      'place_category': '{{PLACE_CATEGORY_RAW}}',
      'place_keywords': '{{PLACE_KEYWORDS}}'
    });
  </script>

  <!-- ─── Primary SEO ─── -->
  <title>{{PLACE_NAME}} — Kuromoon</title>
  <meta name="description" content="{{PLACE_SUMMARY}}">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://kuromoon.com/{{LANG}}/places/{{PLACE_ID}}.html">

  <!-- ─── Hreflang (GEO critical) ─── -->
  <link rel="alternate" hreflang="ko" href="https://kuromoon.com/ko/places/{{PLACE_ID}}.html">
  <link rel="alternate" hreflang="en" href="https://kuromoon.com/en/places/{{PLACE_ID}}.html">
  <link rel="alternate" hreflang="x-default" href="https://kuromoon.com/en/places/{{PLACE_ID}}.html">

  <!-- ─── Open Graph ─── -->
  <meta property="og:type" content="place">
  <meta property="og:site_name" content="Kuromoon">
  <meta property="og:title" content="{{PLACE_NAME}} — Kuromoon">
  <meta property="og:description" content="{{PLACE_SUMMARY}}">
  <meta property="og:url" content="https://kuromoon.com/{{LANG}}/places/{{PLACE_ID}}.html">
  <meta property="og:image" content="{{PLACE_IMAGE}}">
  <meta property="og:locale" content="{{OG_LOCALE}}">

  <!-- ─── Twitter Card ─── -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{PLACE_NAME}}">
  <meta name="twitter:description" content="{{PLACE_SUMMARY}}">
  <meta name="twitter:image" content="{{PLACE_IMAGE}}">

  <!-- ─── Schema.org JSON-LD (AI Crawler Optimized) ─── -->
  <script type="application/ld+json">
  {{JSON_LD}}
  </script>

  <!-- ─── BreadcrumbList ─── -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "BreadcrumbList",
    "itemListElement": [
      { "@type": "ListItem", "position": 1, "name": "Kuromoon", "item": "https://kuromoon.com/{{LANG}}/" },
      { "@type": "ListItem", "position": 2, "name": "{{PLACE_NAME}}", "item": "https://kuromoon.com/{{LANG}}/places/{{PLACE_ID}}.html" }
    ]
  }
  </script>

  <link rel="stylesheet" href="../../css/style.css">
</head>
<body data-place-id="{{PLACE_ID}}">

  <!-- ─── Header ─── -->
  <header class="site-header">
    <div class="container">
      <div class="header-inner">
        <a href="../index.html" class="logo" style="font-size:1rem;font-weight:700;">
          ← Kuromoon 🌙
        </a>
        <div class="lang-switch">
          <a href="../../ko/places/{{PLACE_ID}}.html" class="lang-btn {{KO_ACTIVE}}">KO</a>
          <a href="../../en/places/{{PLACE_ID}}.html" class="lang-btn {{EN_ACTIVE}}">EN</a>
        </div>
      </div>
    </div>
  </header>

  <main data-pagefind-body>
    <div class="container">
      <!-- ─── Hero Image ─── -->
      {{HERO_IMAGE_BLOCK}}

      <!-- ─── Content ─── -->
      <div class="detail-content">

        <div class="detail-header-row">
          <div>
            <div class="detail-category" data-pagefind-filter="category">{{PLACE_CATEGORY_LABEL}}</div>
            <h1 class="detail-title" data-pagefind-meta="title">{{PLACE_NAME}}</h1>
            {{EVENT_DATES}}
          </div>
          <button class="like-btn" id="likeBtn" aria-label="Like this place">🤍</button>
        </div>

        <!-- ─── Trust Badge ─── -->
        {{STATUS_BADGE_BLOCK}}

        <p class="detail-summary" data-pagefind-meta="summary">{{PLACE_SUMMARY}}</p>

        <!-- ─── AI Detailed Description ─── -->
        <div class="ai-description" style="margin-top: 1.5rem; line-height: 1.6; color: var(--text-secondary); background: rgba(255,255,255,0.03); border-left: 3px solid var(--accent); padding: 1rem; border-radius: 4px; font-size: 0.9rem;">
          {{PLACE_DESCRIPTION}}
        </div>

        <!-- ─── Tags ─── -->
        <div class="tags-row">{{TAGS}}</div>

        <!-- ─── Info ─── -->
        <div class="info-section">
          {{INFO_ROWS}}
        </div>

        <!-- ─── Action Buttons ─── -->
        {{RESERVATION_BTN_BLOCK}}
        <div class="action-buttons">
          {{MAP_BUTTONS}}
        </div>
        <div class="action-buttons">
          {{INSTAGRAM_BTN_BLOCK}}
          <button onclick="shareKakao()" class="btn btn-secondary">💬 카카오</button>
          <button onclick="copyLink()" class="btn btn-secondary">🔗 링크</button>
        </div>

      </div>
    </div>
  </main>

  <!-- ─── Footer ─── -->
  <footer class="site-footer">
    <div class="container">
      <p>© 2026 Kuromoon · 한국 로컬 정보</p>
    </div>
  </footer>

  <!-- ─── Kakao SDK ─── -->
  <script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.2/kakao.min.js" integrity="sha384-0b1H2yMyK/yF0H8kR1s5i/mB5a0H0b7Yg7iB-0B2b4k5B0g6iB0k0B2b4k5B0g6i" crossorigin="anonymous"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const kakaoKey = '{{KAKAO_JS_KEY}}';
      if (kakaoKey && kakaoKey !== 'undefined' && window.Kakao) {
        if (!Kakao.isInitialized()) {
          Kakao.init(kakaoKey);
        }
      }
    });
  </script>

  <script src="../../js/main.js"></script>
</body>
</html>
